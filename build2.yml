      - name: Fix launcher icon
        run: |
          PROJECT_DIR=$(find project -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)
          APP_DIR="$PROJECT_DIR/app"

          mkdir -p "$APP_DIR/src/main/res/drawable"

          cat > "$APP_DIR/src/main/res/drawable/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#111111"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M18,18h72v8h-72zM18,18h8v30h-8zM82,18h8v30h-8zM18,42h54v8h-54zM64,42h8v28h-8zM36,66h36v8h-36zM36,66h8v24h-8zM36,82h54v8h-54z" />
              <path
                  android:fillColor="#FF4B61"
                  android:pathData="M24,54h26v-8l14,12 -14,12v-8h-26z" />
          </vector>
          EOF

          sed -i 's/@drawable\/ic_launcher/@mipmap\/ic_launcher/g' "$APP_DIR/src/main/AndroidManifest.xml"