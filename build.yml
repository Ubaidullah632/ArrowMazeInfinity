name: Build ArrowMazeInfinity AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q ArrowMaze99_Android_Project.zip -d project

      - name: Rename app to Arrow Maze Infinity
        run: |
          find project -type f \( \
            -name "*.xml" -o \
            -name "*.java" -o \
            -name "*.gradle" -o \
            -name "*.properties" -o \
            -name "*.html" \
          \) -print0 | while IFS= read -r -d '' file; do
            sed -i \
              -e 's/com\.ubaidullah\.arrowmaze99/com.ubaidullah.arrowmazeinfinity/g' \
              -e 's/Arrow Maze 99/Arrow Maze Infinity/g' \
              -e 's/ArrowMaze99/ArrowMazeInfinity/g' \
              "$file"
          done

      - name: Move Java package folder
        run: |
          OLD="project/app/src/main/java/com/ubaidullah/arrowmaze99"
          NEW="project/app/src/main/java/com/ubaidullah/arrowmazeinfinity"

          if [ -d "$OLD" ]; then
            mkdir -p "$(dirname "$NEW")"
            mv "$OLD" "$NEW"
          fi

      - name: Fix launcher icon
        run: |
          mkdir -p project/app/src/main/res/drawable

          cat > project/app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#111111"
                  android:pathData="M0,0h108v108h-108z" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M18,18h72v8h-72zM18,18h8v30h-8zM82,18h8v30h-8zM18,42h54v8h-54zM64,42h8v28h-8zM36,66h36v8h-36zM36,66h8v24h-8zM36,82h54v8h-54z" />

              <path
                  android:fillColor="#FF4B61"
                  android:pathData="M24,54h26v-8l14,12 -14,12v-8h-26z" />
          </vector>
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build AAB
        run: |
          gradle -p project clean bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ArrowMazeInfinity-AAB
          path: project/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error